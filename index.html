<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ifakara Connect</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --head: #0B3A27; --head-soft: #B9D3C6; --ribbon: #00BF63; --deep: #0F6B3E;
    --ink: #1B2620; --muted: #5E6B64; --line: #DDE7E1; --ground: #F1F5F2; --paper: #FFFFFF; --error: #B42318;
    --font: Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--font); }
  .gate { min-height: 100vh; min-height: 100dvh; background: var(--head); color: #fff;
          display: flex; flex-direction: column; justify-content: center;
          padding: 32px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left)); }
  .gate-inner { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .logos { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .logos .ihi { width: 200px; max-width: 62%; height: auto; }
  .logos .seventy { width: 76px; height: auto; }
  .eyebrow { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--ribbon);
             font: 700 12px/16px var(--font); letter-spacing: .18em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ribbon); }
  h1 { margin: 0; font: 800 clamp(28px, 7.5vw, 36px)/1.15 var(--font); letter-spacing: -.01em; text-wrap: balance; }
  .lede { margin: 0; color: var(--head-soft); font-size: 15px; line-height: 1.6; }
  form { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  label { font: 600 13px/18px var(--font); color: var(--head-soft); }
  input { width: 100%; padding: 15px 16px; border-radius: 10px; border: 2px solid transparent; background: #fff;
          color: var(--ink); font: 500 17px/22px var(--font); }
  input:focus { outline: none; border-color: var(--ribbon); }
  button { padding: 15px 18px; border: 0; border-radius: 10px; background: var(--ribbon); color: var(--head);
           font: 700 16px/20px var(--font); cursor: pointer; }
  button:hover { background: #12D374; }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button[disabled] { opacity: .7; cursor: progress; }
  .msg { min-height: 22px; margin: 0; font-size: 14px; line-height: 1.5; color: #FFD7D2; }
  .hint { margin: 0; font-size: 13px; color: var(--head-soft); }
  .result[hidden], .gate[hidden] { display: none !important; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
         max-width: 620px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
         font-size: 14px; color: var(--muted); }
  .bar a { color: var(--deep); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .result:not([hidden]) { animation: rise .35s ease-out; }
    @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
  @media (max-width: 520px) { .pad { padding-left: 18px !important; padding-right: 18px !important; } }
</style>
</head>
<body>

<main class="gate" id="gate">
  <div class="gate-inner">
    <div class="logos">
      <img class="ihi" src="assets/ihi-logo-white.png" alt="Ifakara Health Institute">
      <img class="seventy" src="assets/70-years-white.png" alt="70 Years of Impact">
    </div>
    <div class="eyebrow">Ifakara Connect initiative</div>
    <h1>See who you should meet at IHI.</h1>
    <p class="lede">We matched everyone who filled in the Ifakara Connect form with the colleagues whose work fits
      theirs best. Enter the email you used in the form to open your card.</p>
    <form id="form" novalidate>
      <label for="email">Your IHI email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none"
             spellcheck="false" placeholder="name@ihi.or.tz" required>
      <button id="go" type="submit">Open my card</button>
      <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    </form>
    <p class="hint">Typing just the part before @ihi.or.tz also works.</p>
  </div>
</main>

<section class="result" id="result" hidden>
  <div class="bar"><span id="who"></span><a href="#" id="switch">Use a different email</a></div>
  <div id="card"></div>
</section>

const DOMAIN = "ihi.or.tz";
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

function normalise(v) {
  v = v.trim().toLowerCase();
  return v.includes("@") ? v : v + "@" + DOMAIN;
}

async function openCard(email) {
  const base = await crypto.subtle.importKey("raw", enc.encode(email), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iterations, hash: "SHA-256"}, base, 512));
  const lookup = Array.from(bits.slice(32, 48), b => b.toString(16).padStart(2, "0")).join("");
  const sealed = VAULT.cards[lookup];
  if (!sealed) return null;
  const raw = b64(sealed);
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
  const packed = await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, key, raw.slice(12));
  const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}

function remember(email) { try { email ? localStorage.setItem("ic-email", email) : localStorage.removeItem("ic-email"); } catch (e) {} }
function remembered() { try { return localStorage.getItem("ic-email"); } catch (e) { return null; } }

async function show(email, fromForm) {
  $("go").disabled = true; $("go").textContent = "Opening…"; $("msg").textContent = "";
  try {
    const html = await openCard(email);
    if (!html) {
      if (fromForm) $("msg").textContent = "We couldn't find a card for " + email +
        ". Check the spelling, or use the email you gave in the Ifakara Connect form.";
      remember(null);
      return;
    }
    $("card").innerHTML = html;
    $("who").textContent = "Card for " + email;
    $("gate").hidden = true; $("result").hidden = false;
    remember(email);
    window.scrollTo(0, 0);
  } catch (e) {
    $("msg").textContent = "Your browser couldn't open the card. Try updating it, or open this page in Chrome or Safari.";
  } finally {
    $("go").disabled = false; $("go").textContent = "Open my card";
  }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("email").value;
  if (!v.trim()) { $("msg").textContent = "Enter your email to continue."; return; }
  show(normalise(v), true);
});

$("switch").addEventListener("click", e => {
  e.preventDefault();
  remember(null);
  $("card").innerHTML = ""; $("result").hidden = true; $("gate").hidden = false;
  $("email").value = ""; $("email").focus();
});

const saved = remembered();
if (saved) { $("email").value = saved; show(normalise(saved), false); }
</script>
